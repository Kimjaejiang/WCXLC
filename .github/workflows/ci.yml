name: CI

# Trigger CI rebuild for v125 returnType fixes
# Release trigger: push to master builds and auto-creates GitHub Release (see release job)
on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - '**/*.js'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - '**/*.js'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      startsWith(github.ref, 'refs/tags/') ||
      (
        !startsWith(github.event.head_commit.message, '[skip ci]') && 
        (
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/dev' ||
          github.event_name == 'pull_request'
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 获取当前时间，生成版本号（YYMMDDHHMMSS）
        id: calc_ver
        run: |
          # 版本号 = 当前时间（Asia/Shanghai），格式 YYMMDDHHMMSS
          VER=$(TZ='Asia/Shanghai' date +%y%m%d%H%M%S)
          echo "VER=${VER}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Cache Gradle build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          NDK_DIR="${ANDROID_HOME}/ndk/29.0.13113456"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK already present"
          else
            echo "Downloading NDK r29..."
            curl -fL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" || { echo "::error::NDK download failed"; exit 1; }
            mkdir -p /tmp/ndk-extract "${ANDROID_HOME}/ndk"
            unzip -q /tmp/ndk.zip -d /tmp/ndk-extract || { echo "::error::NDK unzip failed"; exit 1; }
            mv /tmp/ndk-extract/android-ndk-r29* "$NDK_DIR" || { echo "::error::NDK move failed"; exit 1; }
          fi
          ls "${ANDROID_HOME}/ndk/"
          echo "NDK installed: ${NDK_DIR}"
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -qq
          sudo apt install -y gcc-multilib || true

      - name: Build native library
        run: |
            export LIBCLANG_PATH="$(find "${ANDROID_HOME}/ndk" -path '*llvm/prebuilt/linux-x86_64/lib*' -name 'libclang.so*' 2>/dev/null | head -n1 | xargs -r dirname)"
            echo "LIBCLANG_PATH=${LIBCLANG_PATH}"
            cargo xtask configure > /tmp/cfg.log 2>&1 || { echo "::error::configure failed:"; tail -20 /tmp/cfg.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
            echo "configure OK"
            cargo xtask build --native-only > /tmp/nb.log 2>&1 || { echo "::error::native build failed (err lines):"; grep -nE "error|panicked|failed|fatal|not found|No such|warning: unused" /tmp/nb.log | tail -6 | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
            echo "native build OK"

      - name: Test network to repos
        run: |
          for u in "https://services.gradle.org" "https://repo.maven.apache.org" "https://jitpack.io" "https://api.xposed.info" "https://maven.pkg.github.com" "https://dl.google.com"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 "$u" 2>/dev/null || echo "FAIL")
            echo "::error::NET $u -> $code"
          done
      - name: Pre-download Gradle distribution
        run: |
          DIST_VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9.]*\)-bin.zip/\1/')
          ZIP_URL="https://services.gradle.org/distributions/gradle-${DIST_VER}-bin.zip"
          HASH=$(python3 -c "import hashlib;n=int(hashlib.md5('${ZIP_URL}'.encode()).hexdigest(),16);c='0123456789abcdefghijklmnopqrstuvwxyz';s='';exec('while n>0:\n s=c[n%36]+s\n n//=36',globals());print(s)")
          DEST="$HOME/.gradle/wrapper/dists/gradle-${DIST_VER}-bin/$HASH"
          if [ ! -f "$DEST/gradle-${DIST_VER}-bin.zip" ]; then
            mkdir -p "$DEST"
            curl -fL --retry 3 -o "$DEST/gradle-${DIST_VER}-bin.zip" "$ZIP_URL" || { echo "::error::gradle dist download failed"; exit 1; }
          fi
          echo "Gradle dist ready: $(du -h "$DEST/gradle-${DIST_VER}-bin.zip" | cut -f1)"

      - name: Prepare keystore
        if: github.event_name != 'pull_request'
        run: |
          KS_FILE="$RUNNER_TEMP/wekit-keystore.jks"
          CRED_FILE="$RUNNER_TEMP/keystore-creds.env"

          # ── Decode project keystore from GitHub Secrets ──────────────────
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::group::Decoding project keystore from Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS_FILE"
            KS_SIZE=$(stat -c%s "$KS_FILE" 2>/dev/null || echo 0)
            echo "Keystore file size: ${KS_SIZE} bytes"

            if [ "$KS_SIZE" -lt 100 ]; then
              echo "::error::Decoded keystore is too small (${KS_SIZE} bytes) — Base64 decode may have failed"
              exit 1
            fi

            # Try PKCS12 first, then JKS
            KS_LOADED=false
            for STORE_TYPE in PKCS12 JKS; do
              if keytool -list -keystore "$KS_FILE" \
                   -storetype "$STORE_TYPE" \
                   -storepass "${{ secrets.STORE_PASSWORD }}" \
                   -alias "${{ secrets.KEY_ALIAS }}" >/dev/null 2>&1; then
                echo "Keystore loaded successfully (type=${STORE_TYPE})"
                KS_LOADED=true
                break
              fi
            done

            if [ "$KS_LOADED" = true ]; then
              echo "Using project keystore from GitHub Secrets."
              echo "KS_PASS=${{ secrets.STORE_PASSWORD }}" > "$CRED_FILE"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$CRED_FILE"
              echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$CRED_FILE"
              keytool -list -keystore "$KS_FILE" \
                -storepass "${{ secrets.STORE_PASSWORD }}" \
                -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | head -5
              echo "::endgroup::"
              exit 0
            fi

            echo "::warning::Project keystore present but unreadable — check STORE_PASSWORD / KEY_ALIAS"
            echo "::endgroup::"
          fi

          # ── Fallback: generate temporary CI keystore ─────────────────────
          echo "::group::Generating temporary CI keystore"
          KS_PASS="wcx-store-pass"
          KEY_ALIAS="wcx"
          KEY_PASS="wcx-store-pass"

          rm -f "$KS_FILE"
          keytool -genkeypair -v \
            -keystore "$KS_FILE" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=WCX CI, OU=CI, O=Johnny520, L=CI, S=CI, C=CN"
          echo "KS_PASS=$KS_PASS" > "$CRED_FILE"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$CRED_FILE"
          echo "KEY_PASS=$KEY_PASS" >> "$CRED_FILE"
          keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KEY_ALIAS"
          echo "::endgroup::"

      - name: Build Release (Signed)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEKIT_KEYSTORE_FILE: ${{ runner.temp }}/wekit-keystore.jks
          GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
        run: |
          export JAVA_TOOL_OPTIONS="-Djava.net.preferIPv4Stack=true"
          source "$RUNNER_TEMP/keystore-creds.env"
          export WEKIT_KEYSTORE_PASSWORD="$KS_PASS"
          export WEKIT_KEY_ALIAS="$KEY_ALIAS"
          export WEKIT_KEY_PASSWORD="$KEY_PASS"
          ./gradlew assembleRelease --warning-mode all --stacktrace > /tmp/gradle.log 2>&1 || { echo "::error::gradle assembleRelease failed:"; grep -niE "FAILURE:|What went wrong|Execution failed|Could not (resolve|download|find|GET)|Caused by:|> Task.*FAILED|A problem occurred" /tmp/gradle.log | tail -10 | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }

      - name: Build Release (Unsigned)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist/apk
          find app/build/outputs/apk -type f -name '*.apk' -exec cp -v {} dist/apk/ \;
          echo "Collected APKs:"
          echo "${VER}" > dist/apk/ver.txt
          ls -1 dist/apk

      - name: Collect mappings
        run: |
          mkdir -p dist/mapping
          for m in app/build/outputs/mapping/*/mapping.txt; do
            flavorDir=$(basename "$(dirname "$m")")
            cp -v "$m" "dist/mapping/mapping-${flavorDir}.txt"
          done
          ls -1 dist/mapping || echo "(no mappings)"

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: wcx-apk
          path: dist/apk

      - name: Upload Release Obfuscation Mapping
        uses: actions/upload-artifact@v7
        with:
          name: wcx-mapping
          path: dist/mapping/*.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: wcx-apk
          path: artifacts

      - name: Generate version info
        id: version
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          # 版本号 = 当前时间（Asia/Shanghai），格式 YYMMDDHHMMSS；versionCode 取后 6 位（与 build.gradle.kts 一致）
          # 复用 build job 的版本号（与 APK 内 versionName 一致），保证 Release tag 不漂移
          VER=$(cat artifacts/ver.txt)
          VERSION_CODE=${VER: -6}
          VERSION_TAG="${VER}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "hash=${GIT_HASH}" >> $GITHUB_OUTPUT
          echo "count=${VERSION_CODE}" >> $GITHUB_OUTPUT

          cat > artifacts/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_TAG}",
            "commit": "${GIT_HASH}"
          }
          EOF

          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "prev_tag=" >> $GITHUB_OUTPUT
            echo "changelog=首次发布" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" || echo "")

          FEATURES=""
          FIXES=""
          REMOVED=""
          OTHER=""

          while IFS= read -r line; do
            msg=$(echo "$line" | sed 's/^- //')
            if echo "$msg" | grep -qiE "^(feat|新增|添加|增加|实现)"; then
              FEATURES="${FEATURES}- ${msg}"$'\n'
            elif echo "$msg" | grep -qiE "^(fix|修复|bug|解决|修)"; then
              FIXES="${FIXES}- ${msg}"$'\n'
            elif echo "$msg" | grep -qiE "^(remove|删除|移除|去掉)"; then
              REMOVED="${REMOVED}- ${msg}"$'\n'
            else
              OTHER="${OTHER}- ${msg}"$'\n'
            fi
          done <<< "$COMMITS"

          CHANGELOG=""

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### 🎉 新增功能"$'\n'
            CHANGELOG="${CHANGELOG}${FEATURES}"$'\n'
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 修复问题"$'\n'
            CHANGELOG="${CHANGELOG}${FIXES}"$'\n'
          fi

          if [ -n "$REMOVED" ]; then
            CHANGELOG="${CHANGELOG}### 🗑️ 移除功能"$'\n'
            CHANGELOG="${CHANGELOG}${REMOVED}"$'\n'
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### 🔧 其他改进"$'\n'
            CHANGELOG="${CHANGELOG}${OTHER}"$'\n'
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="暂无详细更新记录"
          fi

          echo "$CHANGELOG" > artifacts/CHANGELOG.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated changelog:"
          cat artifacts/CHANGELOG.md

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WCXLC ${{ steps.version.outputs.tag }}
          body: |
            ## WCXLC ${{ steps.version.outputs.tag }}

            正式发行版本

            提交 SHA: `${{ steps.version.outputs.hash }}`

            ${{ steps.changelog.outputs.changelog }}

            ### 📦 下载
            - 下方 Assets 中下载对应架构的 APK
            - update.json 供模块内置更新器使用
          files: |
            artifacts/*.apk
            artifacts/update.json
            artifacts/CHANGELOG.md
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
